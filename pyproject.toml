[project]
name = "glx-tracker"
dynamic = ["version"]
description = "GLX Tracker: desktop time & activity tracker for ERPNext (glx_timetrack)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "keyring>=24",
    "PySide6-Essentials>=6.7",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pynput>=1.7.7; sys_platform == 'win32'",
    "uiautomation>=2.0.20; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10", "pillow>=10"]
test = ["pytest>=8"]

[project.scripts]
glx-tracker = "glx_tracker.ui.app:main"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "glx_tracker"
